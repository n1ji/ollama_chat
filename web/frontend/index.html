<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>O.C.GUI web</title>
<link rel="stylesheet" href="style.css">
<script src="markdown.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>
<div class="backdrop" aria-hidden="true"></div>

<header class="toolbar glass" id="toolbar">
  <h1>O.C.GUI</h1>
  <span class="grow"></span>
  <div class="select-wrap">
    <select id="model" title="Model" aria-label="Model"></select>
  </div>
  <button id="refresh" class="icon" title="Reload the model list" aria-label="Reload the model list">
    <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg>
  </button>
  <span class="sep" aria-hidden="true"></span>
  <button id="save" class="icon" title="Save chat" aria-label="Save chat">
    <svg viewBox="0 0 24 24"><path d="M12 4v11"/><path d="M8 11l4 4 4-4"/><path d="M5 19h14"/></svg>
  </button>
  <button id="load" class="icon" title="Load chat" aria-label="Load chat">
    <svg viewBox="0 0 24 24"><path d="M12 15V4"/><path d="M8 8l4-4 4 4"/><path d="M5 19h14"/></svg>
  </button>
  <button id="clear" class="icon" title="New chat" aria-label="New chat">
    <svg viewBox="0 0 24 24"><path d="M12 20h8"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
  </button>
  <span class="sep" aria-hidden="true"></span>
  <button id="glass-btn" class="icon" title="Glass appearance" aria-label="Glass appearance" aria-expanded="false" aria-controls="glass-pop">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor" stroke="none"/></svg>
  </button>
  <input id="file" type="file" accept=".json,application/json" hidden>
</header>

<div class="pop glass" id="glass-pop" hidden>
  <label for="glass">Glass</label>
  <div class="range-row">
    <span>Clear</span>
    <input id="glass" type="range" min="0" max="100" step="1" value="60">
    <span>Tinted</span>
  </div>
</div>

<main id="chat"><div id="messages"></div></main>

<footer class="dock" id="dock">
  <div id="status" role="status"></div>
  <div class="composer glass">
    <textarea id="input" rows="1" placeholder="Message" aria-label="Message"></textarea>
    <button id="redo" class="icon" title="Redo the last answer" aria-label="Redo the last answer">
      <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.6-5.9"/><path d="M4 4v5h5"/></svg>
    </button>
    <button id="send" class="send" title="Send" aria-label="Send">
      <svg viewBox="0 0 24 24"><path d="M12 19V6"/><path d="M6 11l6-6 6 6"/></svg>
    </button>
    <button id="stop" class="send stop" title="Stop" aria-label="Stop" hidden>
      <svg viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor" stroke="none"/></svg>
    </button>
  </div>
</footer>
</body>
</html>
